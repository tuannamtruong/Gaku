services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: gaku_postgres
    environment:
      POSTGRES_DB: gaku
      POSTGRES_USER: gaku
      POSTGRES_PASSWORD: gaku_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaku -d gaku"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-migrator:
    build:
      context: .
      dockerfile: docker/Dockerfile.Migrator
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=gaku;Username=gaku;Password=gaku_password"
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"


volumes:
  postgres_data:
