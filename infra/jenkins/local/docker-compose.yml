name: jenkins

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.controller
    image: gaku-jenkins:latest
    container_name: gaku-jenkins
    restart: unless-stopped

    ports:
      - "8090:8080"

    volumes:
      - jenkins_home:/var/jenkins_home
      - ./jenkins.yaml:/var/jenkins_home/jenkins.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock       # Allow jenkins controller to call Docker API in host system

    # GID 1001 is the docker socket group on this host.
    # `stat /var/run/docker.sock` to verify.
    group_add:
      - "1001"

    secrets: [GITHUB_TOKEN, DOCKERHUB_TOKEN, kubeconfig]

  smee:
    image: node:lts-alpine
    command: node /smee-relay.js
    volumes:
      - ./smee-relay.js:/smee-relay.js:ro
    environment:
      SMEE_URL: ${SMEE_URL}
      TARGET: http://jenkins:8080/github-webhook/
    restart: unless-stopped
    depends_on:
      - jenkins

# Files in /run/secrets/, which jenkins.yaml reads as ${NAME}.
secrets:
  GITHUB_TOKEN:
    environment: GITHUB_TOKEN
  DOCKERHUB_TOKEN:
    environment: DOCKERHUB_TOKEN
  kubeconfig:
    file: ./kubeconfig

volumes:
  jenkins_home:
    name: gaku-jenkins-home
