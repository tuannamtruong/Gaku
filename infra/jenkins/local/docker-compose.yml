name: jenkins

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gaku-jenkins
    restart: unless-stopped

    ports:
      - "8090:8080"
      - "50000:50000"

    environment:
      KUBECONFIG: /etc/kubeconfig

    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/nam/Gaku:/home/nam/Gaku:ro
      - ./kubeconfig:/etc/kubeconfig:ro

    networks:
      default:                        # smee reaches http://jenkins:8080 here
      minikube:                       # kubectl and helm reach minikube:8443 here
        ipv4_address: 192.168.49.254  # a dynamic one can take minikube's 192.168.49.2 while minikube is stopped

    # GID 1001 matches the docker socket group on this host.
    # Run `stat /var/run/docker.sock` to verify if docker socket access fails.
    group_add:
      - "1001"

  smee:
    image: node:lts-alpine
    command: node /smee-relay.js
    volumes:
      - ./smee-relay.js:/smee-relay.js:ro
    environment:
      SMEE_URL: ${SMEE_URL}
      TARGET: http://jenkins:8080/github-webhook/
    restart: unless-stopped
    depends_on:
      - jenkins

networks:
  minikube:
    external: true

volumes:
  jenkins_home:
    name: gaku-jenkins-home
