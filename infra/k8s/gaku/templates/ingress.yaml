{{- with .Values.ingress.nginx }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gaku-ingress
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "gaku.labels" $ | nindent 4 }}
spec:
  rules:
    - host: {{ .host }}
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: gaku-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gaku-web
                port:
                  number: 8080
{{- end }}
{{- with .Values.ingress.alb }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gaku-api
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "gaku.labels" $ | nindent 4 }}
  annotations:
    alb.ingress.kubernetes.io/group.name: {{ .group }}
    alb.ingress.kubernetes.io/group.order: "10"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gaku-api
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gaku-web
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "gaku.labels" $ | nindent 4 }}
  annotations:
    alb.ingress.kubernetes.io/group.name: {{ .group }}
    alb.ingress.kubernetes.io/group.order: "20"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/success-codes: "200"
    # Blazor app (web pod) requires stateful session.
    alb.ingress.kubernetes.io/target-group-attributes: "stickiness.enabled=true,stickiness.type=lb_cookie,stickiness.lb_cookie.duration_seconds=86400,deregistration_delay.timeout_seconds=30"
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gaku-web
                port:
                  number: 8080
{{- end }}
