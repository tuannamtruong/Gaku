apiVersion: apps/v1
kind: Deployment
metadata:
  name: gaku-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gaku.labels" . | nindent 4 }}
  annotations:
    {{- include "gaku.buildAnnotations" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: gaku-web
  template:
    metadata:
      labels:
        app: gaku-web
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- if .Values.topologySpread }}
      {{- include "gaku.spread" "gaku-web" | nindent 6 }}
      {{- end }}
      containers:
        - name: gaku-web
          image: {{ include "gaku.image" (dict "root" . "name" "gaku-web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
            - name: metrics
              containerPort: 9464
          envFrom:
            - configMapRef:
                name: gaku-config
            - secretRef:
                name: gaku-secret
          env:
            - name: METRICS_PORT
              value: "9464"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: gaku-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gaku.labels" . | nindent 4 }}
spec:
  selector:
    app: gaku-web
  ports:
  - port: 8080
    targetPort: 8080
