apiVersion: apps/v1
kind: Deployment
metadata:
  name: gaku-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gaku.labels" . | nindent 4 }}
  annotations:
    {{- include "gaku.buildAnnotations" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: gaku-api
  template:
    metadata:
      labels:
        app: gaku-api
    spec:
      {{- if .Values.topologySpread }}
      {{- include "gaku.spread" "gaku-api" | nindent 6 }}
      {{- end }}
      containers:
        - name: gaku-api
          image: {{ include "gaku.image" (dict "root" . "name" "gaku-api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
            - name: metrics
              containerPort: 9464
          envFrom:
            - configMapRef:
                name: gaku-config
            - secretRef:
                name: gaku-secret
          # Diagnose variables. They are to be read by "echo" endpoint, which give pod's network-related data.
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: METRICS_PORT
              value: "9464"
          resources:
            # no CPU throttling: latency cost is more problematic than the risk of one Pod consuming excessive CPU.
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: gaku-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gaku.labels" . | nindent 4 }}
spec:
  selector:
    app: gaku-api
  ports:
  - port: 8080
    targetPort: 8080
