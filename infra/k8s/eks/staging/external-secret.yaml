# RDS database credentials and Npgsql connection string
# Requires "External Secrets Operator" and the IAM role that
# infra/terraform/modules/pod-identity grants its service account.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: gaku
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gaku-secret
  namespace: gaku
spec:
  refreshInterval: 4h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: gaku-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: gaku-staging/database
