apiVersion: apps/v1
kind: Deployment
metadata:
  name: gaku-api
  namespace: gaku
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gaku-api
  template:
    metadata:
      labels:
        app: gaku-api
    spec:
      containers:
      - name: gaku-api
        image: gaku-api:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: gaku-config
        - secretRef:
            name: gaku-secret
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
