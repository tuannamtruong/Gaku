apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: gaku
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    spec:
      containers:
        - name: migrator
          image: gaku-migrator:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: gaku-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      restartPolicy: OnFailure
