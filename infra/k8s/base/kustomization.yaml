apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Everything here is true in every environment. What differs — where the images
# come from, where the connection string comes from, how traffic gets in, and
# whether Postgres runs in-cluster — belongs to the overlay.
#
#   local/               minikube: in-cluster Postgres, nginx ingress, images from the local daemon
#   overlays/staging/    EKS: RDS, ALB ingress, images from ECR
#   overlays/production/ the same, plus a second replica, an HPA and a PDB
resources:
  - namespace.yaml
  - configmap.yaml
  - api/deployment.yaml
  - api/service.yaml
  - web/deployment.yaml
  - web/service.yaml
  - db-migration
