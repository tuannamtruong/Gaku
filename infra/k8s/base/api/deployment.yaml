apiVersion: apps/v1
kind: Deployment
metadata:
  name: gaku-api
  namespace: gaku
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: gaku-api
  template:
    metadata:
      labels:
        app: gaku-api
    spec:
      containers:
        - name: gaku-api
          image: gaku-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: gaku-config
            - secretRef:
                name: gaku-secret
          # Diagnose variables. They are to be read by "echo" endpoint, which give pod's network-related data.
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            # no CPU throttling: latency cost is more problematic than the risk of one Pod consuming excessive CPU.
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
