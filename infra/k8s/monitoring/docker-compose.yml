# Offline viewer for the archive saved by make monitoring_archive. Started by make monitoring_view.
services:
  prometheus:
    image: quay.io/prometheus/prometheus:v3.15.0
    user: "${UID:-1000}"
    command:
      - --config.file=/etc/prometheus/empty.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=100y
    configs:
      - source: prometheus
        target: /etc/prometheus/empty.yml
    volumes:
      - ${MON_ARCHIVE_DIR:?run through make monitoring_view}:/prometheus
    ports:
      - "127.0.0.1:9091:9090"

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    configs:
      - source: datasource
        target: /etc/grafana/provisioning/datasources/prometheus.yml
    ports:
      - "127.0.0.1:3001:3000"

configs:
  # No scrape jobs, so nothing new is written into the saved data.
  prometheus:
    content: |
      global: {}
  datasource:
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://prometheus:9090
          isDefault: true
